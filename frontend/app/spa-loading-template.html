<!--
  SPA loading screen — shown by Nuxt for client-only (ssr:false) routes, i.e.
  /institute and /student, from the moment the HTML shell is served until Vue
  mounts AND the initial route (auth guard's /me check) resolves. This is the
  window that was previously blank after a "Log as" handoff.
-->
<div style="position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0f172a;color:#e2e8f0;font-family:system-ui,-apple-system,'Segoe UI',sans-serif;z-index:2147483647">
  <div style="width:44px;height:44px;border:4px solid rgba(56,189,248,0.25);border-top-color:#38bdf8;border-radius:50%;animation:pm-spin .7s linear infinite"></div>
  <div style="margin-top:14px;font-size:0.9rem;letter-spacing:.02em">Loading…</div>
</div>
<style>@keyframes pm-spin{to{transform:rotate(360deg)}}</style>
